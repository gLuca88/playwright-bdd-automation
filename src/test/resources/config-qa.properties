# ============================================
# QA Environment Configuration
# ============================================

# Application
base.url=https://eventhub.rahulshettyacademy.com

# Browser
browser.name=chromium
browser.headless=false
browser.timeout=30000

# ============================================
# Playwright Artifacts
# ============================================

# Trace
playwright.trace.enabled=true
playwright.trace.onFailure=true

# Video
playwright.video.enabled=true
playwright.video.onFailure=true

# Screenshot
playwright.screenshot.enabled=true
playwright.screenshot.onFailure=true

# ============================================
# Reporting
# ============================================

report.type=allure

# ============================================
# Logging
# ============================================

log.level=INFO
